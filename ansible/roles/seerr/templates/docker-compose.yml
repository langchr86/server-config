---
services:
  seerr:
    container_name: "seerr"
    image: ghcr.io/seerr-team/seerr:v3
    init: true
    environment:
      - PUID={{ uid }}
      - PGID={{ gid }}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - {{ js_config_folder }}:/app/config
    ports:
      - 5055:5055
    networks:
      - caddy_jellyfin_net

networks:
  caddy_jellyfin_net:
    external: true
